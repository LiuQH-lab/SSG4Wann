name: Version consistency

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-version:
    name: Check package version metadata
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check project version metadata
        run: python scripts/check_release_version.py

      - name: Test version guard
        run: python -m unittest discover -s test -p "test_release_version.py" -v
