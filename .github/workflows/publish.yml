name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate and build Python package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the tagged commit to be on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error title=Invalid release commit::Tag $GITHUB_REF_NAME does not point to a commit on main."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag and project version
        run: python scripts/check_release_version.py --tag "$GITHUB_REF_NAME"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build package
        run: python -m build

      - name: Check built package
        run: |
          python scripts/check_release_version.py --tag "$GITHUB_REF_NAME" --artifacts dist/*
          python -m twine check dist/*

      - name: Store validated package
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish Python package
    needs: validate-release
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/ssg4wann
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download validated package
        uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
